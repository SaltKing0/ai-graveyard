<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AI Graveyard — dead AI projects, live lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --night-1: #0a0d18; --night-2: #101527;
    --stone: #8d9199; --stone-dark: #565b66; --stone-light: #b9bec7;
    --engraved: #3c4048; --engraved-shadow: rgba(255,255,255,.22);
    --moss: #7da87b; --moss-dim: #55704f;
    --moon: #e8e6df; --faded: #9aa0ac;
    --serif-display: "Cinzel", "Times New Roman", serif;
    --serif-body: "EB Garamond", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.8) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60% 20%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 80% 50%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 10% 80%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 85%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 50% 45%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 75%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 10%, rgba(255,255,255,.6) 50%, transparent 51%),
      linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 55%, #131b2e 100%);
    color: var(--moon);
    font: 18px/1.6 var(--serif-body);
    background-attachment: fixed;
  }

  /* ── Header ─────────────────────────────────────────── */
  header { text-align: center; padding: 72px 20px 36px; max-width: 1200px; margin: 0 auto; }
  header .moon {
    width: 74px; height: 74px; border-radius: 50%; margin: 0 auto 18px;
    background: radial-gradient(circle at 35% 35%, #fdfcf5, #d8d5c4 60%, #b9b5a0);
    box-shadow: 0 0 40px 12px rgba(232,230,223,.18), 0 0 120px 40px rgba(232,230,223,.07);
  }
  header h1 {
    margin: 0; font: 700 clamp(30px, 5vw, 52px)/1.15 var(--serif-display);
    letter-spacing: .14em; text-transform: uppercase; color: var(--moon);
    text-shadow: 0 2px 24px rgba(232,230,223,.25);
  }
  header .sub {
    margin: 14px auto 0; max-width: 640px; color: var(--faded);
    font-style: italic; font-size: 19px;
  }
  header .sub a { color: var(--moss); text-decoration: none; border-bottom: 1px dotted var(--moss); }
  header .sub a:hover { color: #a3c9a1; }

  /* ── Stats ──────────────────────────────────────────── */
  .stats {
    max-width: 760px; margin: 30px auto 0; padding: 0 20px;
    display: flex; justify-content: center; gap: 64px; flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat .num {
    font: 700 40px/1 var(--serif-display); color: var(--moon);
    text-shadow: 0 0 18px rgba(232,230,223,.2);
  }
  .stat .lbl {
    margin-top: 6px; font: 500 11px/1 var(--serif-display);
    letter-spacing: .28em; text-transform: uppercase; color: var(--faded);
  }

  /* ── Cause bar ──────────────────────────────────────── */
  .causebar { max-width: 560px; margin: 34px auto 0; padding: 0 20px; }
  .causebar .bar {
    display: flex; height: 8px; border-radius: 4px; overflow: hidden;
    border: 1px solid rgba(125,168,123,.25); background: rgba(0,0,0,.3);
  }
  .causebar .seg { height: 100%; }
  .causebar .legend {
    margin-top: 12px; font-size: 15px; color: var(--faded);
    display: flex; flex-wrap: wrap; gap: 6px 22px; justify-content: center; font-style: italic;
  }
  .legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

  /* ── Controls ───────────────────────────────────────── */
  .controls {
    max-width: 1200px; margin: 44px auto 8px; padding: 0 20px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;
  }
  .controls input[type="search"] {
    flex: 0 1 380px; background: rgba(0,0,0,.35); color: var(--moon);
    border: 1px solid rgba(154,160,172,.3); border-radius: 2px; padding: 11px 18px;
    font: 17px var(--serif-body); font-style: italic; outline: none;
  }
  .controls input[type="search"]:focus { border-color: var(--moss); }
  .controls input[type="search"]::placeholder { color: rgba(154,160,172,.6); }
  .chip {
    background: transparent; border: 1px solid rgba(154,160,172,.35); color: var(--faded);
    border-radius: 2px; padding: 8px 16px; font: 15px var(--serif-body); cursor: pointer;
    letter-spacing: .04em;
  }
  .chip:hover { color: var(--moon); border-color: var(--faded); }
  .chip.active { color: var(--night-1); background: var(--moss); border-color: var(--moss); font-weight: 600; }

  /* ── Cemetery grid ──────────────────────────────────── */
  main { max-width: 1200px; margin: 40px auto 60px; padding: 0 20px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 56px 36px; align-items: end; justify-items: center;
  }

  /* Tombstone */
  .tomb {
    position: relative; width: 100%; max-width: 300px; cursor: pointer;
    padding: 34px 24px 30px; text-align: center;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.09), transparent 60%),
      linear-gradient(175deg, #9aa0a8 0%, #7e838d 45%, #6a6f79 100%);
    border-radius: 150px 150px 6px 6px;
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.25),
      inset 0 -6px 14px rgba(0,0,0,.35),
      0 18px 30px -12px rgba(0,0,0,.75),
      0 40px 60px -30px rgba(0,0,0,.6);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .tomb:hover {
    transform: translateY(-6px);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.25),
      inset 0 -6px 14px rgba(0,0,0,.35),
      0 26px 40px -12px rgba(0,0,0,.8),
      0 50px 70px -30px rgba(0,0,0,.65);
  }
  .tomb::before { /* grass mound base */
    content: ""; position: absolute; left: -14%; right: -14%; bottom: -14px; height: 22px;
    background: radial-gradient(ellipse at 50% 0%, #2c3b2a 0%, #1d2a1c 70%, transparent 71%);
    border-radius: 50%; z-index: -1;
  }
  .tomb .cross { font: 26px/1 var(--serif-display); color: var(--engraved); text-shadow: 0 1px 0 var(--engraved-shadow); }
  .tomb .rip {
    margin-top: 8px; font: 700 12px/1 var(--serif-display);
    letter-spacing: .5em; text-indent: .5em; color: var(--engraved);
    text-shadow: 0 1px 0 var(--engraved-shadow);
  }
  .tomb h3 {
    margin: 14px 0 4px; font: 700 21px/1.25 var(--serif-display);
    color: var(--engraved); text-shadow: 0 1px 0 var(--engraved-shadow);
    overflow-wrap: anywhere;
  }
  .tomb .dates {
    font: 15px/1.4 var(--serif-body); color: #4a4e57;
    text-shadow: 0 1px 0 var(--engraved-shadow);
  }
  .tomb .divider {
    width: 46px; height: 1px; margin: 12px auto;
    background: linear-gradient(90deg, transparent, var(--engraved), transparent);
  }
  .tomb .oneliner {
    margin: 0; font: italic 15px/1.45 var(--serif-body); color: #43474f;
    text-shadow: 0 1px 0 var(--engraved-shadow);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tomb .cause {
    margin-top: 14px; display: inline-block;
    font: 500 11px/1 var(--serif-display); letter-spacing: .18em; text-transform: uppercase;
    color: #23262b; background: rgba(0,0,0,.18); border-radius: 2px; padding: 6px 10px;
  }
  .status-badge {
    display: inline-block; font: 500 12px/1 var(--serif-display);
    letter-spacing: .14em; text-transform: uppercase; border-radius: 2px; padding: 5px 10px;
  }
  .status-alive { color: #2f4a2e; background: var(--moss); }
  .status-paused { color: #4a3f22; background: #c9b06a; }
  .empty { color: var(--faded); padding: 60px 0 40px; text-align: center; font-style: italic; font-size: 20px; }

  /* ── Modal (epitaph plaque) ─────────────────────────── */
  dialog {
    background: linear-gradient(170deg, #23262e, #1a1d24);
    color: var(--moon); border: 1px solid rgba(154,160,172,.3);
    border-radius: 4px; max-width: 680px; width: calc(100% - 40px);
    padding: 40px 44px 32px; text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06);
  }
  dialog::backdrop { background: rgba(4,6,12,.8); backdrop-filter: blur(3px); }
  dialog .cross { font: 30px/1 var(--serif-display); color: var(--faded); }
  dialog h2 {
    margin: 12px 0 2px; font: 700 30px/1.2 var(--serif-display);
    letter-spacing: .06em; color: var(--moon);
  }
  dialog .rip-line { color: var(--faded); font-size: 16px; font-style: italic; margin-bottom: 18px; }
  dialog .oneliner { font-size: 19px; margin: 0 0 6px; }
  dialog .epitaph {
    margin: 20px auto; max-width: 480px; padding: 14px 20px;
    border-top: 1px solid rgba(154,160,172,.25); border-bottom: 1px solid rgba(154,160,172,.25);
    font-style: italic; font-size: 18px; color: #cfd3da;
  }
  dialog h4 {
    margin: 22px 0 8px; font: 500 12px/1 var(--serif-display);
    letter-spacing: .3em; text-transform: uppercase; color: var(--faded);
  }
  dialog .lesson { font-size: 18px; max-width: 520px; margin: 0 auto; color: var(--moon); }
  dialog .pm {
    white-space: pre-wrap; font-size: 16.5px; text-align: left; max-width: 540px;
    margin: 0 auto; color: #c4c8d0; font-style: italic;
  }
  dialog .meta {
    margin-top: 24px; font-size: 15.5px; color: var(--faded); font-style: italic;
  }
  dialog .meta b { color: var(--moon); font-weight: 600; }
  dialog a { color: var(--moss); text-decoration: none; border-bottom: 1px dotted var(--moss); }
  dialog .close {
    margin-top: 26px; background: transparent; color: var(--moss);
    border: 1px solid var(--moss); border-radius: 2px; padding: 10px 28px;
    font: 500 13px var(--serif-display); letter-spacing: .2em; text-transform: uppercase; cursor: pointer;
  }
  dialog .close:hover { background: var(--moss); color: var(--night-1); }

  /* ── Footer ─────────────────────────────────────────── */
  footer {
    text-align: center; padding: 30px 20px 60px; color: rgba(154,160,172,.55);
    font-style: italic; font-size: 16px;
  }
  footer .grass { font-size: 13px; letter-spacing: .4em; color: var(--moss-dim); margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <div class="moon"></div>
  <h1>The AI Graveyard</h1>
  <p class="sub">Here lie AI projects — MVPs, POCs, weekend hacks — remembered not for how they died,
     but for what they taught. <a href="https://github.com/SaltKing0/ai-graveyard#contribute">Bury your own →</a></p>
</header>

<section class="stats" id="stats"></section>

<section class="causebar">
  <div class="bar" id="causebar"></div>
  <div class="legend" id="legend"></div>
</section>

<div class="controls">
  <input id="q" type="search" placeholder="Search the deceased…" autocomplete="off">
  <span id="chips" style="display:contents"></span>
</div>

<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>No graves match. The dead rest quietly.</div></main>

<dialog id="dlg">
  <div class="cross">✝</div>
  <h2 id="d-name"></h2>
  <div class="rip-line" id="d-rip"></div>
  <p class="oneliner" id="d-oneliner"></p>
  <div id="d-epitaph"></div>
  <h4>Lesson</h4><p class="lesson" id="d-lesson"></p>
  <div id="d-pm-wrap"><h4>Postmortem</h4><div class="pm" id="d-pm"></div></div>
  <div class="meta" id="d-meta"></div>
  <button class="close" onclick="document.getElementById('dlg').close()">Close</button>
</dialog>

<footer>
  <div class="grass">· · · · · · · · · · · · · · · · · · · ·</div>
  In loving memory of the compute we lost.
</footer>

<script>
const CAUSE_COLORS = {
  "model-too-dumb": "#b06a6a", "api-costs": "#b3925e", "prompt-drift": "#a9a35e",
  "shipped-by-platform": "#926aa8", "no-demand": "#5e7fa8", "fun-only": "#5ea89f",
  "complexity": "#a85e7e", "context-limits": "#7e5ea8", "latency": "#5e86a8", "other": "#8a8f99"
};
let DATA = { stats: { causes: {}, total: 0 }, graves: [] };
let activeCause = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

async function load() {
  const res = await fetch("data/graves.json");
  DATA = await res.json();
  renderStats(); renderChips(); renderGrid();
}

function renderStats() {
  const s = DATA.stats;
  const avgYears = s.avg_lifespan_days ? (s.avg_lifespan_days / 365).toFixed(1) : "0";
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="num">${s.total}</div><div class="lbl">graves</div></div>
    <div class="stat"><div class="num">${Object.keys(s.causes).length}</div><div class="lbl">causes of death</div></div>
    <div class="stat"><div class="num">${avgYears} yr</div><div class="lbl">avg lifespan</div></div>`;
  const total = s.total || 1;
  document.getElementById("causebar").innerHTML = Object.entries(s.causes).map(([c, n]) =>
    `<div class="seg" style="width:${(n / total * 100).toFixed(2)}%;background:${CAUSE_COLORS[c] || "#8a8f99"}" title="${esc(c)}: ${n}"></div>`).join("");
  document.getElementById("legend").innerHTML = Object.entries(s.causes).map(([c, n]) =>
    `<span><span class="sw" style="background:${CAUSE_COLORS[c] || "#8a8f99"}"></span>${esc(c)} (${n})</span>`).join("");
}

function renderChips() {
  const counts = {};
  DATA.graves.forEach(g => counts[g.cause] = (counts[g.cause] || 0) + 1);
  const chips = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([c, n]) =>
    `<button class="chip" data-cause="${esc(c)}">${esc(c)} · ${n}</button>`).join("");
  document.getElementById("chips").innerHTML = chips;
  document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
    activeCause = activeCause === ch.dataset.cause ? null : ch.dataset.cause;
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x.dataset.cause === activeCause));
    renderGrid();
  });
}

function renderGrid() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const graves = DATA.graves.filter(g =>
    (!activeCause || g.cause === activeCause) &&
    (!q || [g.name, g.one_liner, g.lesson, g.model, g.framework, g.language, g.author]
      .join(" ").toLowerCase().includes(q)));
  document.getElementById("empty").hidden = graves.length > 0;
  document.getElementById("grid").innerHTML = graves.map(g => {
    const isAlive = g.status && g.status !== "dead";
    const dates = isAlive
      ? `<span class="status-badge status-${esc(g.status)}">${g.status === "alive" ? "♥ still breathing" : "⏸ hibernating"}</span>`
      : `b. ${esc(g.born)}<br>d. ${esc(g.died)}`;
    return `<article class="tomb" data-slug="${esc(g.slug)}">
      <div class="cross">✝</div>
      <div class="rip">R · I · P</div>
      <h3>${esc(g.name)}</h3>
      <div class="dates">${dates}</div>
      <div class="divider"></div>
      <p class="oneliner">${esc(g.one_liner)}</p>
      <span class="cause">☠ ${esc(g.cause)}</span>
    </article>`;
  }).join("");
  document.querySelectorAll(".tomb").forEach(el =>
    el.onclick = () => openGrave(DATA.graves.find(g => g.slug === el.dataset.slug)));
}

function openGrave(g) {
  if (!g) return;
  const days = g.lifespan_days;
  const lifespan = days >= 365 ? `${(days / 365).toFixed(1)} years` : `${days} days`;
  document.getElementById("d-name").textContent = g.name;
  document.getElementById("d-rip").textContent = `${g.born} – ${g.died}  ·  lived ${lifespan}  ·  cause of death: ${g.cause}`;
  document.getElementById("d-oneliner").textContent = g.one_liner;
  document.getElementById("d-epitaph").innerHTML = g.epitaph
    ? `<div class="epitaph">“${esc(g.epitaph)}”</div>` : "";
  document.getElementById("d-lesson").textContent = g.lesson;
  document.getElementById("d-pm-wrap").style.display = g.postmortem ? "" : "none";
  document.getElementById("d-pm").textContent = g.postmortem || "";
  document.getElementById("d-meta").innerHTML =
    `by <b>${esc(g.author)}</b>` +
    (g.model ? ` · model: <b>${esc(g.model)}</b>` : "") +
    (g.framework ? ` · framework: <b>${esc(g.framework)}</b>` : "") +
    (g.language ? ` · language: <b>${esc(g.language)}</b>` : "") +
    (g.evidence ? ` · <a href="${esc(g.evidence)}" target="_blank" rel="noopener">evidence ↗</a>` : "");
  document.getElementById("dlg").showModal();
}

document.getElementById("q").addEventListener("input", renderGrid);
load();
</script>
</body>
</html>
