<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AI Graveyard — dead AI projects, live lessons</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #12161f; --line: #232a36;
    --text: #d7dde8; --dim: #8a94a6; --accent: #7ee0a3;
    --head: #f4f6fa; --danger: #e07e7e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  header { padding: 48px 20px 24px; max-width: 1060px; margin: 0 auto; }
  header h1 { margin: 0 0 8px; font-size: 34px; color: var(--head); letter-spacing: 1px; }
  header p { margin: 0; color: var(--dim); max-width: 720px; }
  header .contribute { color: var(--accent); text-decoration: none; }
  header .contribute:hover { text-decoration: underline; }

  .stats {
    max-width: 1060px; margin: 24px auto 0; padding: 0 20px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;
  }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .stat .num { font-size: 26px; color: var(--head); }
  .stat .lbl { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }

  .causebar { max-width: 1060px; margin: 16px auto 0; padding: 0 20px; }
  .causebar .bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); }
  .causebar .seg { height: 100%; }
  .causebar .legend { margin-top: 8px; font-size: 12px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 14px; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .controls { max-width: 1060px; margin: 28px auto 0; padding: 0 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .controls input[type="search"] {
    flex: 1 1 260px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font: inherit;
  }
  .chip {
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; font: inherit;
  }
  .chip:hover { color: var(--text); }
  .chip.active { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 700; }

  main { max-width: 1060px; margin: 20px auto 80px; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .grave {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; cursor: pointer; display: flex; flex-direction: column; gap: 8px;
    transition: border-color .15s;
  }
  .grave:hover { border-color: var(--accent); }
  .grave .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .grave h3 { margin: 0; font-size: 18px; color: var(--head); }
  .grave .rip { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .grave .oneliner { margin: 0; color: var(--text); font-size: 14px; }
  .grave .lesson { margin: 4px 0 0; color: var(--dim); font-size: 13px; font-style: italic;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .grave .meta { margin-top: auto; padding-top: 8px; font-size: 12px; color: var(--dim);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cause-tag { color: var(--bg); background: var(--accent); border-radius: 4px; padding: 2px 8px; font-weight: 700; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 14px; max-width: 720px; width: calc(100% - 40px); padding: 28px 30px;
  }
  dialog::backdrop { background: rgba(4, 6, 10, .72); }
  dialog h2 { margin: 0 0 4px; color: var(--head); }
  dialog .rip-line { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  dialog .epitaph { border-left: 3px solid var(--accent); padding: 6px 14px; margin: 14px 0; font-style: italic; color: var(--head); }
  dialog h4 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
  dialog .pm { white-space: pre-wrap; font-size: 14px; }
  dialog .close { margin-top: 22px; }
  dialog a { color: var(--accent); }
  .btn { background: var(--accent); color: var(--bg); border: 0; border-radius: 8px;
    padding: 9px 16px; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>⚰️ The AI Graveyard</h1>
  <p>Dead AI projects — MVPs, POCs, weekend hacks — and the lessons they died with.
     Every stone is one markdown file. <a class="contribute" href="https://github.com/SaltKing0/ai-graveyard#contribute">Bury your own →</a></p>
</header>

<section class="stats" id="stats"></section>
<section class="causebar">
  <div class="bar" id="causebar"></div>
  <div class="legend" id="legend"></div>
</section>

<div class="controls">
  <input id="q" type="search" placeholder="Search name, idea, lesson…" autocomplete="off">
  <span id="chips" style="display:contents"></span>
</div>

<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>No graves match. The dead rest quietly.</div></main>

<dialog id="dlg">
  <h2 id="d-name"></h2>
  <div class="rip-line" id="d-rip"></div>
  <p id="d-oneliner"></p>
  <div id="d-epitaph"></div>
  <h4>Lesson</h4><p id="d-lesson"></p>
  <div id="d-pm-wrap"><h4>Postmortem</h4><div class="pm" id="d-pm"></div></div>
  <div class="meta" id="d-meta" style="margin-top:16px;font-size:13px;color:var(--dim)"></div>
  <button class="btn close" onclick="document.getElementById('dlg').close()">Close</button>
</dialog>

<script>
const CAUSE_COLORS = {
  "model-too-dumb": "#e07e7e", "api-costs": "#e0b87e", "prompt-drift": "#e0d67e",
  "shipped-by-platform": "#b87ee0", "no-demand": "#7ea8e0", "fun-only": "#7ee0d6",
  "complexity": "#d67e9c", "context-limits": "#9c7ee0", "latency": "#7e9ce0", "other": "#8a94a6"
};
let DATA = { stats: { causes: {}, total: 0 }, graves: [] };
let activeCause = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

async function load() {
  const res = await fetch("data/graves.json");
  DATA = await res.json();
  renderStats(); renderChips(); renderGrid();
}

function renderStats() {
  const s = DATA.stats;
  const avgYears = s.avg_lifespan_days ? (s.avg_lifespan_days / 365).toFixed(1) : "0";
  const topModel = Object.entries(s.models || {})[0];
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="num">${s.total}</div><div class="lbl">graves</div></div>
    <div class="stat"><div class="num">${Object.keys(s.causes).length}</div><div class="lbl">causes of death</div></div>
    <div class="stat"><div class="num">${avgYears} yr</div><div class="lbl">avg lifespan</div></div>
    <div class="stat"><div class="num">${topModel ? esc(topModel[0]) : "—"}</div><div class="lbl">most-used model</div></div>`;
  const total = s.total || 1;
  const segs = Object.entries(s.causes).map(([c, n]) =>
    `<div class="seg" style="width:${(n / total * 100).toFixed(2)}%;background:${CAUSE_COLORS[c] || "#8a94a6"}" title="${esc(c)}: ${n}"></div>`).join("");
  document.getElementById("causebar").innerHTML = segs;
  document.getElementById("legend").innerHTML = Object.entries(s.causes).map(([c, n]) =>
    `<span><span class="sw" style="background:${CAUSE_COLORS[c] || "#8a94a6"}"></span>${esc(c)} (${n})</span>`).join("");
}

function renderChips() {
  const counts = {};
  DATA.graves.forEach(g => counts[g.cause] = (counts[g.cause] || 0) + 1);
  const chips = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([c, n]) =>
    `<button class="chip" data-cause="${esc(c)}">${esc(c)} · ${n}</button>`).join("");
  document.getElementById("chips").innerHTML = chips;
  document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
    activeCause = activeCause === ch.dataset.cause ? null : ch.dataset.cause;
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x.dataset.cause === activeCause));
    renderGrid();
  });
}

function renderGrid() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const graves = DATA.graves.filter(g =>
    (!activeCause || g.cause === activeCause) &&
    (!q || [g.name, g.one_liner, g.lesson, g.model, g.framework, g.language, g.author]
      .join(" ").toLowerCase().includes(q)));
  document.getElementById("empty").hidden = graves.length > 0;
  document.getElementById("grid").innerHTML = graves.map(g => {
    const born = g.born, died = g.died;
    return `<article class="grave" data-slug="${esc(g.slug)}">
      <div class="top"><h3>${esc(g.name)}</h3><span class="rip">† ${born} – ${died}</span></div>
      <p class="oneliner">${esc(g.one_liner)}</p>
      <p class="lesson">“${esc(g.lesson)}”</p>
      <div class="meta">
        <span class="cause-tag" style="background:${CAUSE_COLORS[g.cause] || "#8a94a6"}">${esc(g.cause)}</span>
        <span>${esc(g.author)}</span>
        ${g.model ? `<span>· ${esc(g.model)}</span>` : ""}
        ${g.language ? `<span>· ${esc(g.language)}</span>` : ""}
      </div>
    </article>`;
  }).join("");
  document.querySelectorAll(".grave").forEach(el =>
    el.onclick = () => openGrave(DATA.graves.find(g => g.slug === el.dataset.slug)));
}

function openGrave(g) {
  if (!g) return;
  const days = g.lifespan_days;
  const lifespan = days >= 365 ? `${(days / 365).toFixed(1)} years` : `${days} days`;
  document.getElementById("d-name").textContent = g.name;
  document.getElementById("d-rip").textContent = `${g.born} – ${g.died}  ·  lived ${lifespan}  ·  cause: ${g.cause}`;
  document.getElementById("d-oneliner").textContent = g.one_liner;
  document.getElementById("d-epitaph").innerHTML = g.epitaph
    ? `<div class="epitaph">“${esc(g.epitaph)}”</div>` : "";
  document.getElementById("d-lesson").textContent = g.lesson;
  document.getElementById("d-pm-wrap").style.display = g.postmortem ? "" : "none";
  document.getElementById("d-pm").textContent = g.postmortem || "";
  document.getElementById("d-meta").innerHTML =
    `by ${esc(g.author)}` +
    (g.model ? ` · model: ${esc(g.model)}` : "") +
    (g.framework ? ` · framework: ${esc(g.framework)}` : "") +
    (g.language ? ` · language: ${esc(g.language)}` : "") +
    (g.evidence ? ` · <a href="${esc(g.evidence)}" target="_blank" rel="noopener">evidence ↗</a>` : "");
  document.getElementById("dlg").showModal();
}

document.getElementById("q").addEventListener("input", renderGrid);
load();
</script>
</body>
</html>
