name: graveyard-ci

on:
  pull_request:
    paths: ["graves/**", "scripts/**", "site/**"]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate graves & compile JSON
        run: python3 scripts/build.py
      - name: Check site data freshness
        run: |
          python3 scripts/build.py
          git diff --exit-code -- site/data/graves.json \
            || { echo "::error::graves.json is stale — run 'python3 scripts/build.py' and commit the result"; exit 1; }

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
